[logger]
Filename = "logs/tyche-mock.log"
Level = "debug"
Compress = false
MaxSize = 20
MaxAge = 7
MaxBackups = 30
Named = "[TYCHE-MOCK]"

[redis]
# Use a dedicated Redis DB for this mock environment.
Domain = "flydex:mock"
MaxIdle = 8
MaxActive = 0
IdleTimeout = 0
URI = "redis://:CHANGE_ME_REDIS_PASSWORD@127.0.0.1:6379/11"

[tyche]
chainType = "dydx"
listen = "0.0.0.0:8081"
readTimeout = 30
writeTimeout = 120
maxHeaderBytes = 1048576

# Tyche does not hold a dYdX trading private key. User dYdX proxy wallet
# keys live only in the dydxtrading sidecar keystore.
account = ""
privateKey = ""

# Mock mode: Tyche submits native params.cosmosTx to the local mock sidecar.
dydxTradingURL = "http://127.0.0.1:8090/dydx/trading"
dydxWalletCreateURL = "http://127.0.0.1:8090/wallet/create"
dydxSubaccountDepositURL = "http://127.0.0.1:8090/subaccount/deposit"
dydxEventSourceURL = "http://127.0.0.1:8090"
dydxMarketPriceURL = "http://127.0.0.1:8090/prices"
marketOrderSlippageBps = 100

# Fill these with official values when switching to real mode.
dydxChainID = "dydx-local-1"
dydxHeightURL = "http://127.0.0.1:8090/status"
dydxSubaccountNumber = 0
dydxCollateralAssetId = 0
dydxCollateralQuantumsPerUsd = "1000000"
dydxMinStatefulOrderMarginUsd = "20"
dydxRetainedCollateralUsd = "1"
closeSettlementMode = "margin_only"
closeSettlementAsset = "FDEX"
closeSettlementAssetDecimals = 18
tradeCloseCallbackURL = ""
dydxGoodTilSeconds = 604800

# Internal API key must be set per environment and must match any trusted
# sidecar/event service. Do not commit production values.
internalAPIKey = "CHANGE_ME_INTERNAL_API_KEY_AT_LEAST_32_CHARS"
dydxEventSourceAPIKey = "CHANGE_ME_INTERNAL_API_KEY_AT_LEAST_32_CHARS"

# NECO is still the only external deposit/withdrawal entry.
# Leave empty until the NECO RPC is ready for this test environment.
necoRpcURL = ""

errorURI = ""
succeedURI = ""
failedURI = ""

errorNumberOfConcurrent = 4
failedNumberOfConcurrent= 4
pendingNumberOfConcurrent = 16
sentNumberOfConcurrent = 8
succeedNumberOfConcurrent= 4

nonceCheckInterval = 3
nonceKeepalive = 60
maxBumpingGasTimes = 10
pendingRetryInterval = 1
sentRetryInterval = 1
redisRetryInterval = 3
networkRetryInterval = 5
waitMinedRetryInterval = 10
callbackRetryInterval = 15

expectedMD5Password = "CHANGE_ME_ADMIN_PASSWORD_MD5"
allowedIP = "127.0.0.1"

