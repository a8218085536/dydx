version: "3"

services:
  dydxprotocold0:
    image: local:dydxprotocol-mainnet-single
    environment:
      - ETH_RPC_ENDPOINT=${ETH_RPC_ENDPOINT}
      - DYDX_MAINNET_SINGLE_CHAIN_ID=${DYDX_MAINNET_SINGLE_CHAIN_ID:-flydex-mainnet-1}
      - DYDX_MAINNET_SINGLE_MONIKER=${DYDX_MAINNET_SINGLE_MONIKER:-flydex-validator-1}
      - DYDX_MAINNET_SINGLE_TIMEOUT_COMMIT=${DYDX_MAINNET_SINGLE_TIMEOUT_COMMIT:-300ms}
      - DYDX_BRIDGE_DAEMON_ENABLED=${DYDX_BRIDGE_DAEMON_ENABLED:-false}
      - DYDX_MAINNET_SINGLE_BRIDGE_DELAY_BLOCKS=${DYDX_MAINNET_SINGLE_BRIDGE_DELAY_BLOCKS:-600}
      - DYDX_MAINNET_SINGLE_GENESIS_ACCOUNT_USDC_AMOUNT=${DYDX_MAINNET_SINGLE_GENESIS_ACCOUNT_USDC_AMOUNT:-80000000000000}
      - DYDX_MAINNET_SINGLE_VALIDATOR_USDC_AMOUNT=${DYDX_MAINNET_SINGLE_VALIDATOR_USDC_AMOUNT:-80000000000000}
      - DYDX_MAINNET_SINGLE_TREASURY_USDC_AMOUNT=${DYDX_MAINNET_SINGLE_TREASURY_USDC_AMOUNT:-80000000000000}
      - DYDX_MAINNET_SINGLE_MARKET_MAKER_1_USDC_AMOUNT=${DYDX_MAINNET_SINGLE_MARKET_MAKER_1_USDC_AMOUNT:-80000000000000}
      - DYDX_MAINNET_SINGLE_MARKET_MAKER_2_USDC_AMOUNT=${DYDX_MAINNET_SINGLE_MARKET_MAKER_2_USDC_AMOUNT:-80000000000000}
      - DYDX_MAINNET_SINGLE_TYCHE_CUSTODY_USDC_AMOUNT=${DYDX_MAINNET_SINGLE_TYCHE_CUSTODY_USDC_AMOUNT:-80000000000000}
      - DYDX_MAINNET_SINGLE_GENESIS_ACCOUNT_NATIVE_AMOUNT=${DYDX_MAINNET_SINGLE_GENESIS_ACCOUNT_NATIVE_AMOUNT:-80000000000000000000000000}
      - DYDX_MAINNET_SINGLE_VALIDATOR_NATIVE_AMOUNT=${DYDX_MAINNET_SINGLE_VALIDATOR_NATIVE_AMOUNT:-80000000000000000000000000}
      - DYDX_MAINNET_SINGLE_TREASURY_NATIVE_AMOUNT=${DYDX_MAINNET_SINGLE_TREASURY_NATIVE_AMOUNT:-80000000000000000000000000}
      - DYDX_MAINNET_SINGLE_MARKET_MAKER_1_NATIVE_AMOUNT=${DYDX_MAINNET_SINGLE_MARKET_MAKER_1_NATIVE_AMOUNT:-80000000000000000000000000}
      - DYDX_MAINNET_SINGLE_MARKET_MAKER_2_NATIVE_AMOUNT=${DYDX_MAINNET_SINGLE_MARKET_MAKER_2_NATIVE_AMOUNT:-80000000000000000000000000}
      - DYDX_MAINNET_SINGLE_TYCHE_CUSTODY_NATIVE_AMOUNT=${DYDX_MAINNET_SINGLE_TYCHE_CUSTODY_NATIVE_AMOUNT:-80000000000000000000000000}
      - DYDX_MAINNET_SINGLE_LOG_LEVEL=${DYDX_MAINNET_SINGLE_LOG_LEVEL:-info}
      - DYDX_INDEXER_KAFKA_CONN_STR=${DYDX_INDEXER_KAFKA_CONN_STR:-kafka:9092}
      - DYDX_INDEXER_KAFKA_MAX_RETRY=${DYDX_INDEXER_KAFKA_MAX_RETRY:-20}
      - DYDX_INDEXER_SEND_OFFCHAIN_DATA=${DYDX_INDEXER_SEND_OFFCHAIN_DATA:-true}
      - DD_ENV=mainnet_single_${USER}
      - DD_AGENT_HOST=datadog-agent
      - DAEMON_HOME=/dydxprotocol/chain/.validator
    volumes:
      - ./localnet-mainnet-single/dydxprotocol0:/dydxprotocol/chain/.validator
      - ./localnet-mainnet-single/keys:/dydxprotocol/keys
    ports:
      - "26656:26656"
      - "26657:26657"
      - "9090:9090"
      - "9092:9092"
      - "1317:1317"
    networks:
      - flydex_backend

  slinky0:
    image: ghcr.io/skip-mev/slinky-sidecar:v1.1.0
    entrypoint: >
      sh -c "slinky --marketmap-provider dydx_migration_api --oracle-config /etc/slinky/oracle.json --log-std-out-level error"
    environment:
      - SLINKY_CONFIG_PROVIDERS_RAYDIUM_API_API_ENDPOINTS_0_URL=${RAYDIUM_URL}
      - SLINKY_CONFIG_PROVIDERS_UNISWAPV3_API-BASE_API_ENDPOINTS_0_URL=${UNISWAPV3_BASE_URL}
      - SLINKY_CONFIG_PROVIDERS_UNISWAPV3_API-ETHEREUM_API_ENDPOINTS_0_URL=${UNISWAPV3_ETHEREUM_URL}
      - SLINKY_CONFIG_PROVIDERS_RAYDIUM_API_API_INTERVAL=${PROVIDER_NODE_QUERY_INTERVAL}
      - SLINKY_CONFIG_PROVIDERS_UNISWAPV3_API-BASE_API_INTERVAL=${PROVIDER_NODE_QUERY_INTERVAL}
      - SLINKY_CONFIG_PROVIDERS_UNISWAPV3_API-ETHEREUM_API_INTERVAL=${PROVIDER_NODE_QUERY_INTERVAL}
    volumes:
      - ./contrib/slinky:/etc/slinky
    ports:
      - "8080:8080"
      - "8002:8002"
    networks:
      - flydex_backend

networks:
  flydex_backend:
    external: true
