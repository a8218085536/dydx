version: "3"

services:
  dydxtrading:
    image: local:dydxtrading
    build:
      context: ..
      dockerfile: dydxtrading/Dockerfile
    environment:
      - DYDX_TRADING_LISTEN=${DYDX_TRADING_LISTEN:-127.0.0.1:8090}
      - DYDX_TRADING_BEARER_TOKEN=${DYDX_TRADING_BEARER_TOKEN}
      - DYDX_EVENT_API_KEY=${DYDX_EVENT_API_KEY:-}
      - DYDX_EVENT_INGEST_KEY=${DYDX_EVENT_INGEST_KEY:-}
      - DYDX_CHAIN_ID=${DYDX_CHAIN_ID}
      - DYDX_REST_URL=${DYDX_REST_URL:-http://127.0.0.1:1317}
      - DYDX_GRPC_URL=${DYDX_GRPC_URL:-127.0.0.1:9090}
      - DYDX_BROADCAST_URL=${DYDX_BROADCAST_URL:-http://127.0.0.1:1317/cosmos/tx/v1beta1/txs}
      - DYDX_TX_GAS_LIMIT=${DYDX_TX_GAS_LIMIT:-500000}
      - DYDX_TX_FEE_AMOUNT=${DYDX_TX_FEE_AMOUNT:-12500000000000000adedx}
      - DYDX_PROXY_WALLET_KEYSTORE_PATH=${DYDX_PROXY_WALLET_KEYSTORE_PATH:-/var/lib/dydxtrading/proxy-wallets.json}
      - DYDX_PROXY_WALLET_KEYSTORE_SECRET=${DYDX_PROXY_WALLET_KEYSTORE_SECRET}
      - DYDX_SYSTEM_PRIVATE_KEY_HEX=${DYDX_SYSTEM_PRIVATE_KEY_HEX:-}
      - DYDX_SYSTEM_MNEMONIC=${DYDX_SYSTEM_MNEMONIC:-}
      - DYDX_SYSTEM_HD_PATH=${DYDX_SYSTEM_HD_PATH:-}
      - DYDX_SYSTEM_BIP39_PASSPHRASE=${DYDX_SYSTEM_BIP39_PASSPHRASE:-}
      - DYDX_GAS_TOP_UP_ENABLED=${DYDX_GAS_TOP_UP_ENABLED:-false}
      - DYDX_GAS_DENOM=${DYDX_GAS_DENOM:-adedx}
      - DYDX_GAS_MIN_BALANCE=${DYDX_GAS_MIN_BALANCE:-0}
      - DYDX_GAS_TOP_UP_AMOUNT=${DYDX_GAS_TOP_UP_AMOUNT:-0}
      - DYDX_GAS_CONFIRM_ATTEMPTS=${DYDX_GAS_CONFIRM_ATTEMPTS:-10}
      - DYDX_GAS_CONFIRM_INTERVAL=${DYDX_GAS_CONFIRM_INTERVAL:-500ms}
      - DYDX_SUBACCOUNT_DEPOSIT_BROADCAST_MODE=${DYDX_SUBACCOUNT_DEPOSIT_BROADCAST_MODE:-BROADCAST_MODE_SYNC}
      - DYDX_RAW_INDEXER_EVENT_SOURCE_URL=${DYDX_RAW_INDEXER_EVENT_SOURCE_URL:-}
      - DYDX_RAW_INDEXER_EVENT_SOURCE_API_KEY=${DYDX_RAW_INDEXER_EVENT_SOURCE_API_KEY:-}
      - DYDX_INDEXER_KAFKA_BROKERS=${DYDX_INDEXER_KAFKA_BROKERS:-}
      - DYDX_INDEXER_KAFKA_TOPIC=${DYDX_INDEXER_KAFKA_TOPIC:-}
      - DYDX_INDEXER_KAFKA_PARTITION=${DYDX_INDEXER_KAFKA_PARTITION:-0}
      - DYDX_INDEXER_KAFKA_MAX_MESSAGES=${DYDX_INDEXER_KAFKA_MAX_MESSAGES:-100}
      - DYDX_INDEXER_KAFKA_READ_TIMEOUT=${DYDX_INDEXER_KAFKA_READ_TIMEOUT:-1s}
      - DYDX_INDEXER_CONSUMER_INTERVAL=${DYDX_INDEXER_CONSUMER_INTERVAL:-2s}
      - TYCHE_URL=${TYCHE_URL:-}
      - TYCHE_INTERNAL_API_KEY=${TYCHE_INTERNAL_API_KEY:-}
    network_mode: host
    volumes:
      - ./data:/var/lib/dydxtrading
    restart: unless-stopped
